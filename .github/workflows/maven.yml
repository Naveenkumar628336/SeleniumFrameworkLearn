# Workflow name — shown on GitHub Actions tab
name: Selenium Test Automation

# When to trigger this workflow
on:
  # Trigger on every push to master branch
  push:
    branches: [ master ]

  # Trigger on every pull request to master
  pull_request:
    branches: [ master ]

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# Jobs to run
jobs:
  selenium-tests:

    # Use Ubuntu server provided by GitHub (free!)
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Download your code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2 — Install Java 11
      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      # Step 3 — Cache Maven dependencies
      # This speeds up subsequent runs
      # No need to download all jars every time
      - name: Cache Maven Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Step 4 — Install Chrome browser
      # Tests need Chrome to run
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # Step 5 — Run tests in headless mode
      # Headless = browser runs without UI
      # Required on CI server (no display available)
      - name: Run Selenium Tests
        run: mvn test -Dheadless=true
        # -Dheadless=true → passes headless=true
        # to System.getProperty in ConfigReader

      # Step 6 — Upload test reports
      # Makes reports downloadable from GitHub
      - name: Upload Test Reports
        uses: actions/upload-artifact@v3
        # Always upload even if tests fail
        if: always()
        with:
          name: test-reports
          path: |
            reports/
            test-output/

      # Step 7 — Upload Screenshots if tests failed
      - name: Upload Failure Screenshots
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: failure-screenshots
          path: reports/screenshots/